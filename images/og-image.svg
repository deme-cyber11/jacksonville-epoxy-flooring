<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f2744"/>
      <stop offset="100%" style="stop-color:#1a3a5c"/>
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c9a227"/>
      <stop offset="100%" style="stop-color:#e8c547"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <!-- Decorative elements -->
  <circle cx="1100" cy="100" r="200" fill="rgba(201,162,39,0.08)"/>
  <circle cx="100" cy="530" r="150" fill="rgba(201,162,39,0.05)"/>

  <!-- Gold accent line -->
  <rect x="100" y="200" width="80" height="4" fill="url(#goldGradient)"/>

  <!-- Main heading -->
  <text x="100" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="700" fill="#ffffff">Jacksonville Epoxy</text>
  <text x="100" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="700" fill="#ffffff">Flooring Pros</text>

  <!-- Tagline -->
  <text x="100" y="430" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="400" fill="url(#goldGradient)">Transform Your Garage in 24 Hours</text>

  <!-- Phone number -->
  <text x="100" y="520" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="600" fill="#ffffff">(904) 555-0199</text>

  <!-- Epoxy drop icon -->
  <g transform="translate(950, 280) scale(3)">
    <path d="M16 2 C16 2 6 14 6 20 C6 25.5 10.5 30 16 30 C21.5 30 26 25.5 26 20 C26 14 16 2 16 2 Z" fill="url(#goldGradient)"/>
    <ellipse cx="12" cy="18" rx="3" ry="4" fill="rgba(255,255,255,0.3)" transform="rotate(-20 12 18)"/>
  </g>

  <!-- Bottom accent bar -->
  <rect x="0" y="610" width="1200" height="20" fill="url(#goldGradient)"/>
</svg>
